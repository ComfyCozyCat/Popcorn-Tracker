<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17110f">
    <title>Popcorn Archive</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-label="Popcorn Archive home">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
          </span>
          <span class="brand-copy">
            <span class="brand-name">Popcorn Archive</span>
            <span class="brand-tagline">Personal movie tracker</span>
          </span>
        </a>

        <button class="icon-button" type="button" aria-label="Search and filter movies">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.3-4.3"></path>
            <circle cx="11" cy="11" r="7"></circle>
          </svg>
        </button>
      </header>

      <nav class="decade-nav" aria-label="Browse by decade">
        <button class="decade-chip is-active" type="button">50's</button>
        <button class="decade-chip" type="button">60's</button>
        <button class="decade-chip" type="button">70's</button>
        <button class="decade-chip" type="button">80's</button>
        <button class="decade-chip" type="button">90's</button>
        <button class="decade-chip" type="button">2000s</button>
        <button class="decade-chip" type="button">2010s</button>
        <button class="decade-chip" type="button">2020s</button>
      </nav>

      <main class="content">
        <section class="section-heading" aria-labelledby="library-title">
          <p class="eyebrow">Popcorn theme</p>
          <h1 id="library-title">Movie Library</h1>
        </section>

        <section class="poster-grid" aria-label="Movie cover placeholders">
          <article class="movie-card">
            <img src="assets/placeholders/missing-action.png" alt="Missing Cover action placeholder">
            <div class="movie-card-meta">
              <span>Action</span>
              <span>Unrated</span>
            </div>
          </article>

          <article class="movie-card">
            <img src="assets/placeholders/missing-romance.png" alt="Missing Cover romance placeholder">
            <div class="movie-card-meta">
              <span>Romance</span>
              <span>Unrated</span>
            </div>
          </article>

          <article class="movie-card">
            <img src="assets/placeholders/missing-noir.png" alt="Missing Cover noir placeholder">
            <div class="movie-card-meta">
              <span>Noir</span>
              <span>Unrated</span>
            </div>
          </article>

          <article class="movie-card">
            <img src="assets/placeholders/missing-horror.png" alt="Missing Cover horror placeholder">
            <div class="movie-card-meta">
              <span>Horror</span>
              <span>Unrated</span>
            </div>
          </article>

          <article class="movie-card">
            <img src="assets/placeholders/missing-adventure.png" alt="Missing Cover adventure placeholder">
            <div class="movie-card-meta">
              <span>Adventure</span>
              <span>Unrated</span>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
