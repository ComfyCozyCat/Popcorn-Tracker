<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17110f">
    <title>Popcorn Archive</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-label="Popcorn Archive home">
          <span class="brand-mark" aria-hidden="true">
            <img class="brand-mark-image" src="assets/icons/popcorn-movie-cinema-svgrepo-com.svg" alt="">
          </span>
          <span class="brand-copy">
            <span class="brand-name">Popcorn Archive</span>
            <span class="brand-tagline">Personal movie tracker</span>
          </span>
        </a>

        <div class="top-bar-actions" aria-label="Search and filter controls">
          <button id="random-movie-button" class="icon-button" type="button" aria-label="Pick a random movie">
            <img class="icon-button-image icon-button-image-random" src="assets/icons/dice.svg" alt="" aria-hidden="true">
          </button>
          <button class="icon-button" type="button" aria-label="Filter movies">
            <img class="icon-button-image" src="assets/icons/filter.svg" alt="" aria-hidden="true">
          </button>
          <button class="icon-button" type="button" aria-label="Search movies">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m21 21-4.3-4.3"></path>
              <circle cx="11" cy="11" r="7"></circle>
            </svg>
          </button>
        </div>
      </header>

      <div id="decade-nav-shell" class="decade-nav-shell">
        <button
          id="decade-nav-prev"
          class="edge-button edge-button-left decade-edge-button"
          type="button"
          aria-label="Scroll decades to the left"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M14.5 5.5 8 12l6.5 6.5"></path>
          </svg>
        </button>

        <nav id="decade-nav" class="decade-nav" aria-label="Browse by decade">
          <button class="decade-chip is-active" type="button">50's</button>
          <button class="decade-chip" type="button">60's</button>
          <button class="decade-chip" type="button">70's</button>
          <button class="decade-chip" type="button">80's</button>
          <button class="decade-chip" type="button">90's</button>
          <button class="decade-chip" type="button">2000s</button>
          <button class="decade-chip" type="button">2010s</button>
          <button class="decade-chip" type="button">2020s</button>
        </nav>

        <button
          id="decade-nav-next"
          class="edge-button edge-button-right decade-edge-button"
          type="button"
          aria-label="Scroll decades to the right"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M9.5 5.5 16 12l-6.5 6.5"></path>
          </svg>
        </button>
      </div>

      <main class="content">
        <section class="library-decade" aria-labelledby="fifties-title">
          <div class="section-copy">
            <h2 id="fifties-title">Scroll Through the 1950s</h2>
            <p class="section-description">
              Cruise through each year, compare classics side by side, and scroll
              around until you spot your next favorite.
            </p>
          </div>

          <div class="year-toolbar" aria-label="Year display controls">
            <span class="year-toolbar-label">Expand:</span>
            <button id="expand-all-button" class="year-toolbar-button" type="button">
              <img src="assets/icons/expand-all.svg" alt="" aria-hidden="true">
              <span>All</span>
            </button>
            <button id="expand-none-button" class="year-toolbar-button" type="button">
              <img src="assets/icons/expand-none.svg" alt="" aria-hidden="true">
              <span>None</span>
            </button>

            <span class="year-toolbar-divider" aria-hidden="true"></span>

            <span class="year-toolbar-label">Show:</span>
            <button id="toggle-studio-button" class="year-toolbar-button is-active" type="button" aria-pressed="true">
              <span>Studio</span>
            </button>
            <button id="toggle-title-button" class="year-toolbar-button is-active" type="button" aria-pressed="true">
              <span>Title</span>
            </button>
            <button id="toggle-ratings-button" class="year-toolbar-button is-active" type="button" aria-pressed="true">
              <span>Ratings</span>
            </button>
          </div>

          <div id="year-rows" class="year-rows" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="movie-detail-overlay" class="movie-detail-overlay" hidden>
      <div class="movie-detail-backdrop" data-close-detail="true"></div>
      <section
        id="movie-detail-card"
        class="movie-detail-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="movie-detail-title"
        tabindex="-1"
      >
        <button
          id="movie-detail-close"
          class="movie-detail-close"
          type="button"
          aria-label="Close movie details"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 6 18 18"></path>
            <path d="M18 6 6 18"></path>
          </svg>
        </button>

        <div class="movie-detail-layout">
          <img id="movie-detail-poster" class="movie-detail-poster" src="" alt="">

          <div class="movie-detail-copy">
            <p id="movie-detail-kicker" class="movie-detail-kicker"></p>
            <h2 class="movie-detail-heading">
              <span id="movie-detail-title"></span>
              <span id="movie-detail-rank" class="movie-detail-rank"></span>
            </h2>
            <p id="movie-detail-distributor" class="movie-detail-distributor"></p>

            <dl class="movie-detail-facts">
              <div>
                <dt>Director</dt>
                <dd id="movie-detail-director"></dd>
              </div>
              <div>
                <dt>Starring</dt>
                <dd id="movie-detail-starring"></dd>
              </div>
              <div>
                <dt>Runtime</dt>
                <dd id="movie-detail-runtime"></dd>
              </div>
            </dl>

            <div class="movie-detail-links">
              <a id="movie-detail-film-link" class="movie-detail-link" href="" target="_blank" rel="noreferrer noopener">
                <span class="movie-detail-link-icon" aria-hidden="true">
                  <img src="assets/icons/wikipedia.svg" alt="">
                </span>
                <span>Wikipedia</span>
              </a>
              <a id="movie-detail-imdb-link" class="movie-detail-link movie-detail-link-imdb" href="" target="_blank" rel="noreferrer noopener">
                <span class="movie-detail-link-icon movie-detail-link-icon-imdb" aria-hidden="true">
                  <img src="assets/icons/imdb-svgrepo-com.svg" alt="">
                </span>
                <span>IMDb</span>
              </a>
            </div>

            <div class="movie-detail-actions" aria-label="Movie reactions">
              <button id="movie-detail-favorite" class="movie-detail-action movie-detail-action-favorite" type="button">
                <img src="assets/icons/ribbon.svg" alt="" aria-hidden="true">
              </button>
              <button id="movie-detail-like" class="movie-detail-action movie-detail-action-thumb" type="button" aria-label="Mark movie thumbs up">
                <img src="assets/icons/thumbs-up.svg" alt="" aria-hidden="true">
              </button>
              <button id="movie-detail-dislike" class="movie-detail-action movie-detail-action-thumb" type="button" aria-label="Mark movie thumbs down">
                <img src="assets/icons/thumbs-down.svg" alt="" aria-hidden="true">
              </button>
              <button id="movie-detail-calendar" class="movie-detail-action movie-detail-action-thumb movie-detail-action-calendar" type="button" aria-label="Toggle movie calendar action">
                <img src="assets/icons/calendar.svg" alt="" aria-hidden="true">
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="random-picker-overlay" class="random-picker-overlay" hidden>
      <div class="random-picker-backdrop" data-close-random-picker="true"></div>
      <section
        id="random-picker-card"
        class="random-picker-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="random-picker-message"
        tabindex="-1"
      >
        <button
          id="random-picker-close"
          class="random-picker-close"
          type="button"
          aria-label="Close random picker"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 6 18 18"></path>
            <path d="M18 6 6 18"></path>
          </svg>
        </button>

        <div class="random-picker-layout">
          <p id="random-picker-message" class="random-picker-message">
            Selecting a random new movie for you!
          </p>
          <div class="random-picker-printer-zone">
            <button
              id="random-picker-ticket"
              class="random-picker-ticket"
              type="button"
              aria-label="Reveal random movie ticket"
              disabled
            >
              <span class="random-picker-ticket-cover">
                <img id="random-picker-ticket-cover-image" class="random-picker-ticket-cover-image" src="" alt="" hidden>
                <span id="random-picker-ticket-cover-mystery" class="random-picker-ticket-cover-mystery" aria-hidden="true">?</span>
              </span>
              <span class="random-picker-ticket-stub">
                <span id="random-picker-ticket-kicker" class="random-picker-ticket-kicker">
                  RANDOM PICK
                </span>
                <span id="random-picker-ticket-title" class="random-picker-ticket-title">
                  Printing your ticket...
                </span>
                <span id="random-picker-ticket-meta" class="random-picker-ticket-meta">
                  Hold tight while the printer finds an unwatched movie.
                </span>
                <span id="random-picker-ticket-detail" class="random-picker-ticket-detail"></span>
              </span>
              <span class="random-picker-ticket-corners" aria-hidden="true"></span>
              <span class="random-picker-ticket-ridge" aria-hidden="true">
                <span class="random-picker-ticket-ridge-dot"></span>
                <span class="random-picker-ticket-ridge-dot"></span>
                <span class="random-picker-ticket-ridge-dot"></span>
              </span>
            </button>
            <div class="random-picker-printer" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
